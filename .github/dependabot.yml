version: 2
updates:
  - package-ecosystem: gomod
    # One entry for every Go module, so a grouped PR bumps all go.mod files
    # together: tests/ and the examples replace the root module, so a root-only
    # bump would leave their go.mod out of date.
    directories:
      - /
      - /tests
      - /examples/feepayer
      - /examples/parallel-nonces
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 7
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /examples/feepayer/client
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # Buffer the scanner's seven-day minimum: Dependabot reads date-only tag metadata.
      default-days: 8
    groups:
      actions:
        patterns: ["*"]
