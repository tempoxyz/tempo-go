version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 7
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /examples/feepayer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 7
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /examples/feepayer/client
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
