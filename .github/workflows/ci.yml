name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours - catch tempo drift early
  workflow_dispatch:  # Manual trigger

# Superseded pushes to a pull request cancel their older run; main and
# scheduled runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Secure runner
      uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
        # Every module's go.sum keys the module and build cache.
        cache-dependency-path: '**/go.sum'

    - name: Download dependencies
      run: go mod download
      env:
        GOVCS: '*:git'

    - name: Verify modules
      run: go mod verify

    - name: Check go.mod and go.sum are tidy in every module
      run: make tidy-check

    - name: Check formatting
      run: test -z "$(gofmt -s -l .)" || (echo "Run 'make fix':" && gofmt -s -l . && exit 1)

    - name: Vet every module
      run: |
        go vet ./...
        (cd tests && go vet ./...)
        (cd examples/feepayer && go vet ./...)
        (cd examples/parallel-nonces && go vet ./...)

    - name: Staticcheck every module
      run: make lint

    - name: Govulncheck
      run: make vulncheck

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # The go.mod minimum line plus both supported Go releases.
        go-version: ['1.25.x', '1.26.x', '1.27.x']

    steps:
    - name: Secure runner
      uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        # Every module's go.sum keys the module and build cache.
        cache-dependency-path: '**/go.sum'

    - name: Download dependencies
      run: go mod download
      env:
        GOVCS: '*:git'

    - name: Run unit tests
      run: go test -race -shuffle=on ./pkg/...

    - name: Build examples
      run: make build_examples

  fuzz:
    name: Fuzz
    # Seed corpora already run as unit tests; the scheduled run also explores.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Secure runner
      uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
        # Every module's go.sum keys the module and build cache.
        cache-dependency-path: '**/go.sum'

    - name: Download dependencies
      run: go mod download
      env:
        GOVCS: '*:git'

    - name: Run every fuzz target
      run: make fuzz-all FUZZTIME=20s

  integration-localnet:
    name: Integration Tests (Localnet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Secure runner
      uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
        # Every module's go.sum keys the module and build cache.
        cache-dependency-path: '**/go.sum'

    - name: Download dependencies
      run: go mod download
      env:
        GOVCS: '*:git'

    - name: Start Tempo node
      run: docker compose up -d

    - name: Wait for Tempo node to be ready
      run: |
        echo "Waiting for Tempo node to answer JSON-RPC..."
        for _ in {1..60}; do
          if curl -sf -X POST -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
            http://localhost:8545 | grep -q '"result"'; then
            echo "Tempo node is ready!"
            exit 0
          fi
          sleep 1
        done
        echo "Tempo node failed to start"
        docker compose logs
        exit 1

    - name: Run integration tests (localnet lacks fee token liquidity for on-chain tests)
      run: go test -count=1 -v -run "TestIntegration_NodeConnection|TestIntegration_BuilderValidation|TestIntegration_RoundTrip|TestIntegration_T8CurrentCommittee" -timeout=5m .
      working-directory: tests
      env:
        TEMPO_RPC_URL: http://localhost:8545
        TEMPO_HARDFORK: T8

    - name: Show Tempo node logs on failure
      if: failure()
      run: docker compose logs

    - name: Stop Tempo node
      if: always()
      run: docker compose down

  integration-devnet:
    name: Integration Tests (Devnet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Secure runner
      uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
        # Every module's go.sum keys the module and build cache.
        cache-dependency-path: '**/go.sum'

    - name: Download dependencies
      run: go mod download
      env:
        GOVCS: '*:git'

    - name: Run integration tests against devnet
      run: go test -count=1 -v -run TestIntegration -timeout=10m .
      working-directory: tests
      env:
        TEMPO_RPC_URL: ${{ secrets.TEMPO_DEVNET_RPC_URL }}

  integration-testnet:
    name: Integration Tests (Testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Secure runner
      uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.x'
        # Every module's go.sum keys the module and build cache.
        cache-dependency-path: '**/go.sum'

    - name: Download dependencies
      run: go mod download
      env:
        GOVCS: '*:git'

    - name: Run integration tests against testnet
      run: go test -count=1 -v -run TestIntegration -timeout=10m .
      working-directory: tests
      env:
        TEMPO_RPC_URL: ${{ secrets.TEMPO_TESTNET_RPC_URL }}
        # Testnet (moderato) hard-forked T2 → T3 on ~2026-04-21. The default
        # value of TEMPO_HARDFORK in the test harness is "T3", so it's elided
        # here. If a future testnet downgrade or pre-T3 environment is needed,
        # re-add `TEMPO_HARDFORK: T2`.

  # One stable check to require in branch protection, whatever jobs above
  # are added or renamed. Skipped jobs (fuzz on PRs, devnet/testnet for
  # Dependabot) count as passing.
  ci-success:
    name: CI Success
    if: always()
    needs: [lint, test, fuzz, integration-localnet, integration-devnet, integration-testnet]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Secure runner
      uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

    - name: Check job results
      env:
        RESULTS: ${{ toJSON(needs.*.result) }}
      run: |
        echo "$RESULTS"
        if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
          echo "A required job failed or was cancelled."
          exit 1
        fi
