name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours - catch tempo drift early
  workflow_dispatch:  # Manual trigger

permissions: {}

jobs:
  rust-compatibility:
    name: Rust codec and ABI compatibility
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25.x'
    - name: Set up Rust
      run: |
        rustup toolchain install stable nightly --profile minimal
        rustup default nightly
    - name: Build pinned implementations
      run: |
        (cd tests/differential && go build -o ../../bin/tempo-dff .)
        cargo +stable build --locked --manifest-path tests/differential/rust/Cargo.toml
    - name: Compare 1000 deterministic cases and generated ABIs
      run: |
        bin/tempo-dff -role corpus -count 1000 > "$RUNNER_TEMP/tempo-corpus"
        bin/tempo-dff -role replay < "$RUNNER_TEMP/tempo-corpus" > "$RUNNER_TEMP/go-result"
        tests/differential/rust/target/debug/tempo-go-oracle --stdin < "$RUNNER_TEMP/tempo-corpus" > "$RUNNER_TEMP/rust-result"
        cmp "$RUNNER_TEMP/go-result" "$RUNNER_TEMP/rust-result"
        tests/differential/rust/target/debug/tempo-go-oracle --abis > "$RUNNER_TEMP/contracts.json"
        cmp pkg/precompiles/contracts.json "$RUNNER_TEMP/contracts.json"
        go test ./pkg/precompiles

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.x', '1.26.x']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      run: go mod download
      env:
        GOVCS: '*:git'

    - name: Run checks and tests
      run: make check

    - name: Build examples
      run: make build_examples

  integration-localnet:
    name: Integration Tests (Localnet)
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25.x'

    - name: Download dependencies
      run: go mod download
      env:
        GOVCS: '*:git'

    - name: Start Tempo node
      run: docker compose up -d

    - name: Wait for Tempo node to be ready
      run: |
        echo "Waiting for Tempo node to start..."
        for i in {1..30}; do
          if curl -s http://localhost:8545 > /dev/null 2>&1; then
            echo "Tempo node is ready!"
            exit 0
          fi
          echo "Attempt $i: Tempo node not ready yet..."
          sleep 2
        done
        echo "Tempo node failed to start"
        docker compose logs
        exit 1

    - name: Run integration tests (localnet lacks fee token liquidity for on-chain tests)
      run: go test -v -run "TestIntegration_NodeConnection|TestIntegration_BuilderValidation|TestIntegration_RoundTrip" -timeout=5m ./tests
      env:
        TEMPO_RPC_URL: http://localhost:8545

    - name: Show Tempo node logs on failure
      if: failure()
      run: docker compose logs

    - name: Stop Tempo node
      if: always()
      run: docker compose down

  integration-devnet:
    name: Integration Tests (Devnet)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25.x'

    - name: Download dependencies
      run: go mod download
      env:
        GOVCS: '*:git'

    - name: Run integration tests against devnet
      run: go test -v -run TestIntegration -timeout=10m ./tests
      env:
        TEMPO_RPC_URL: ${{ secrets.TEMPO_DEVNET_RPC_URL }}

  integration-testnet:
    name: Integration Tests (Testnet)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25.x'

    - name: Download dependencies
      run: go mod download
      env:
        GOVCS: '*:git'

    - name: Run integration tests against testnet
      run: go test -v -run TestIntegration -timeout=10m ./tests
      env:
        TEMPO_RPC_URL: ${{ secrets.TEMPO_TESTNET_RPC_URL }}
        # Testnet (moderato) hard-forked T2 → T3 on ~2026-04-21. The default
        # value of TEMPO_HARDFORK in the test harness is "T3", so it's elided
        # here. If a future testnet downgrade or pre-T3 environment is needed,
        # re-add `TEMPO_HARDFORK: T2`.
