name: Changelog Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    # The changelog-release version PR, branch, tags, and GitHub releases are
    # created with a short-lived GitHub App token minted via the github-sts
    # action (authorized by .github/sts/release-pr.sts.yaml); the built-in
    # GITHUB_TOKEN is not allowed to create pull requests.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Fetch GitHub token via STS
        id: app-token
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          policy: release-pr

      # fetch-depth: 0 + fetch-tags: true so the Go ecosystem can read prior
      # vX.Y.Z tags when computing the next version, and so the action can diff
      # CHANGELOG.md.
      # The following changelog action pushes the release PR through this token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: tempoxyz/changelogs@4cdda943b3452daf4f6af3dfc25859e03f7b4a31 # System CA verification for package-registry checks
        with:
          github-token: ${{ steps.app-token.outputs.token }}
