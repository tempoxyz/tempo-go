name: Changelog Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    # The changelog-release version PR, branch, tags, and GitHub releases are
    # created with a short-lived GitHub App token minted via the github-sts
    # action (authorized by .github/sts/release-pr.sts.yaml); the built-in
    # GITHUB_TOKEN is not allowed to create pull requests.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf

      - name: Fetch GitHub token via STS
        id: app-token
        uses: tempoxyz/gh-actions/actions/github-sts@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf # main
        with:
          policy: release-pr

      # fetch-depth: 0 + fetch-tags: true so the Go ecosystem can read prior
      # vX.Y.Z tags when computing the next version, and so the action can diff
      # CHANGELOG.md.
      # The following changelog action pushes the release PR through this token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: tempoxyz/changelogs@a19f62e3fdbd6d07b8900eb0568ed09b868bf84d
        with:
          github-token: ${{ steps.app-token.outputs.token }}
