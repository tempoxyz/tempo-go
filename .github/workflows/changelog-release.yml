name: Changelog Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    # The changelog-release version PR, branch, tags, and GitHub releases are
    # created with a short-lived GitHub App token minted via the github-sts
    # action (authorized by .github/sts/release-pr.sts.yaml); the built-in
    # GITHUB_TOKEN is not allowed to create pull requests.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b

      - name: Fetch GitHub token via STS
        id: app-token
        uses: tempoxyz/gh-actions/actions/github-sts@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b
        with:
          policy: release-pr

      # fetch-depth: 0 + fetch-tags: true so the Go ecosystem can read prior
      # vX.Y.Z tags when computing the next version, and so the action can diff
      # CHANGELOG.md.
      # The following changelog action pushes the release PR through this token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: tempoxyz/changelogs@fed7de62e4b5dc585c6eb77aabd1264ecbe82640
        with:
          github-token: ${{ steps.app-token.outputs.token }}
